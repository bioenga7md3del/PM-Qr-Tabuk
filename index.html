<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>PM-QR Dashboard</title>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root{ --line:#e5e7eb }
  .card{background:#fff;border:1px solid var(--line);border-radius:12px}
  .badge{padding:.15rem .5rem;border-radius:.5rem;font-size:.75rem}
</style>
</head>
<body class="bg-slate-50 text-slate-800">
<!-- Notice -->
<div id="notice" class="sticky top-0 z-50 text-center text-sm py-2 bg-sky-50 border-b border-sky-200">
  جارِ الاتصال بـ Firebase…
</div>

<header class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
  <h1 class="font-black text-xl">لوحة الصيانة الوقائية (PM-QR)</h1>
  <div class="flex gap-2">
    <a href="qr.html" class="px-3 py-2 rounded border">صفحة طباعة QR</a>
    <a href="sticker.html" class="px-3 py-2 rounded border">صفحة الاستيكر</a>
  </div>
</header>

<main class="max-w-7xl mx-auto px-4 pb-24">
  <!-- Actions -->
  <section class="card p-4 mb-4">
    <div class="flex flex-wrap gap-2 items-center">
      <button id="btnToggleAdd" class="px-4 py-2 rounded bg-emerald-600 text-white font-bold">+ إضافة جهاز</button>

      <div class="grow"></div>

      <select id="filterSite" class="px-3 py-2 border rounded w-44">
        <option value="">كل المواقع</option>
      </select>
      <select id="filterDept" class="px-3 py-2 border rounded w-44">
        <option value="">كل الأقسام</option>
      </select>
      <input id="filterSearch" class="px-3 py-2 border rounded w-52" placeholder="بحث بالـ Control…">
      <button id="btnClearFilters" class="px-3 py-2 rounded border">مسح الفلاتر</button>

      <button id="btnDelete" class="px-3 py-2 rounded bg-red-600 text-white font-bold">🗑️ مسح الأجهزة المحددة</button>
    </div>

    <!-- Add/Edit panel -->
    <div id="addPanel" class="mt-4 hidden">
      <hr class="my-3">
      <div class="grid md:grid-cols-3 gap-3">
        <div>
          <label class="block text-sm text-slate-500 mb-1">Control Number</label>
          <input id="f_control" class="w-full px-3 py-2 border rounded" placeholder="مثال: AS-0001">
        </div>
        <div>
          <label class="block text-sm text-slate-500 mb-1">الموقع (Site)</label>
          <input list="siteList" id="f_site" class="w-full px-3 py-2 border rounded" placeholder="اختر/اكتب موقع">
          <datalist id="siteList"></datalist>
        </div>
        <div>
          <label class="block text-sm text-slate-500 mb-1">القسم (Department)</label>
          <input list="deptList" id="f_dept" class="w-full px-3 py-2 border rounded" placeholder="اختر/اكتب قسم">
          <datalist id="deptList"></datalist>
        </div>
        <div>
          <label class="block text-sm text-slate-500 mb-1">الموقع التفصيلي / Location (اختياري)</label>
          <input id="f_loc" class="w-full px-3 py-2 border rounded" placeholder="مثال: غرفة عمليات 2">
        </div>
        <div>
          <label class="block text-sm text-slate-500 mb-1">وصف تفصيلي (اختياري)</label>
          <input id="f_desc" class="w-full px-3 py-2 border rounded" placeholder="موديل/سيريال…">
        </div>
        <div>
          <label class="block text-sm text-slate-500 mb-1">القائم بالصيانة (Tech)</label>
          <input list="techList" id="f_tech" class="w-full px-3 py-2 border rounded" placeholder="اختر/اكتب اسم">
          <datalist id="techList"></datalist>
        </div>
        <div>
          <label class="block text-sm text-slate-500 mb-1">تاريخ الصيانة الوقائية (PM Date)</label>
          <input id="f_pm" type="date" class="w-full px-3 py-2 border rounded">
        </div>
      </div>
      <div class="mt-3 flex gap-2">
        <button id="btnSave" class="px-4 py-2 rounded bg-emerald-600 text-white font-bold">حفظ</button>
        <button id="btnCancel" class="px-4 py-2 rounded border">إلغاء</button>
        <div id="editHint" class="text-sm text-slate-500 hidden">أنت تعدل جهاز: <span id="editId" class="font-bold"></span></div>
      </div>
    </div>
  </section>

  <!-- Table -->
  <section class="card p-0 overflow-x-auto">
    <table class="w-full text-sm">
      <thead class="bg-slate-100">
        <tr>
          <th class="p-2 text-center"><input type="checkbox" id="chkAll"></th>
          <th class="p-2 text-right">Control</th>
          <th class="p-2 text-right">Site</th>
          <th class="p-2 text-right">Department</th>
          <th class="p-2 text-right">Location</th>
          <th class="p-2 text-right">Tech</th>
          <th class="p-2 text-right">PM Date</th>
          <th class="p-2 text-right">Next PM</th>
          <th class="p-2 text-center">إجراءات</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </section>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
import {
  getFirestore, collection, getDocs, doc, setDoc, updateDoc, deleteDoc,
  serverTimestamp, query, orderBy
} from "https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDegk1oK0xV8TgrZcwbkRLA2VgzkGK_1MM",
  authDomain: "pmqrtabuk.firebaseapp.com",
  projectId: "pmqrtabuk",
  storageBucket: "pmqrtabuk.firebasestorage.app",
  messagingSenderId: "305570616285",
  appId: "1:305570616285:web:4f6839fd08b8b5aa131c34"
};
const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);

// ===== Helpers =====
const $ = s => document.querySelector(s);
function notify(msg, type='ok'){
  const n = $('#notice');
  n.textContent = msg;
  n.className = 'sticky top-0 z-50 text-center text-sm py-2 border-b ' + 
    (type==='error' ? 'bg-red-50 border-red-200 text-red-700' :
     type==='info'  ? 'bg-sky-50 border-sky-200 text-sky-700' :
                      'bg-emerald-50 border-emerald-200 text-emerald-700');
}
const safeId = s => (s||'').trim().replace(/[\/#?\s]/g,'-');
const toISO  = d => new Date(d).toISOString().slice(0,10);
function addMonths(dateStr, n=6){
  const d = new Date(dateStr); d.setMonth(d.getMonth()+n); return toISO(d);
}

// ===== State =====
let all = [];      // كل الأجهزة
let filtered = []; // بعد الفلاتر
let editingId = null;

// ===== Load =====
async function loadData(){
  notify('جارِ تحميل البيانات…','info');
  const qs = await getDocs(query(collection(db,'assets'), orderBy('control')));
  all = qs.docs.map(d=> ({ id:d.id, ...d.data() }));
  filtered = all.slice();
  fillDatalists();
  fillFilters();
  renderTable();
  notify('تم التحميل ✅','ok');
}

function uniq(arr){ return [...new Set(arr.filter(Boolean))].sort(); }
function fillDatalists(){
  $('#siteList').innerHTML = uniq(all.map(x=>x.site)).map(s=>`<option value="${s}">`).join('');
  $('#deptList').innerHTML = uniq(all.map(x=>x.department)).map(s=>`<option value="${s}">`).join('');
  $('#techList').innerHTML = uniq(all.map(x=>x.tech)).map(s=>`<option value="${s}">`).join('');
}
function fillFilters(){
  $('#filterSite').innerHTML = '<option value="">كل المواقع</option>' + uniq(all.map(x=>x.site)).map(s=>`<option>${s}</option>`).join('');
  $('#filterDept').innerHTML = '<option value="">كل الأقسام</option>' + uniq(all.map(x=>x.department)).map(s=>`<option>${s}</option>`).join('');
}

function applyFilters(){
  const s = $('#filterSite').value.trim();
  const d = $('#filterDept').value.trim();
  const q = $('#filterSearch').value.trim().toLowerCase();
  filtered = all.filter(x=>{
    const okS = !s || x.site===s;
    const okD = !d || x.department===d;
    const okQ = !q || (x.control||'').toLowerCase().includes(q);
    return okS && okD && okQ;
  });
  renderTable();
}

function rowHTML(x){
  const soon = x.next_date ? (new Date(x.next_date) - new Date() < 1000*60*60*24*14) : false;
  return `
    <tr class="border-b">
      <td class="p-2 text-center"><input type="checkbox" class="rchk" value="${x.id}"></td>
      <td class="p-2 font-bold">${x.control||''}</td>
      <td class="p-2">${x.site||''}</td>
      <td class="p-2">${x.department||''}</td>
      <td class="p-2">${x.location||''}</td>
      <td class="p-2">${x.tech||''}</td>
      <td class="p-2">${x.pm_date||''}</td>
      <td class="p-2">${x.next_date||''} ${soon?'<span class="badge bg-amber-100 text-amber-800">قريب</span>':''}</td>
      <td class="p-2 text-center">
        <a target="_blank" class="px-2 py-1 border rounded" href="sticker.html#view/${encodeURIComponent(x.control||'')}">استيكر</a>
        <a target="_blank" class="px-2 py-1 border rounded" href="qr.html?control=${encodeURIComponent(x.control||'')}">QR</a>
        <button class="px-2 py-1 border rounded" onclick="pmDone('${x.id}')">تحديث PM</button>
        <button class="px-2 py-1 border rounded" onclick="startEdit('${x.id}')">تعديل</button>
      </td>
    </tr>
  `;
}

function renderTable(){
  $('#tbody').innerHTML = filtered.map(rowHTML).join('') || 
    `<tr><td colspan="9" class="p-6 text-center text-slate-500">لا توجد بيانات مطابقة</td></tr>`;
  $('#chkAll').checked = false;
}

// ===== Add/Edit =====
function resetForm(){
  ['f_control','f_site','f_dept','f_loc','f_desc','f_tech','f_pm'].forEach(id=> $('#'+id).value='');
  editingId = null;
  $('#editHint').classList.add('hidden');
  $('#editId').textContent = '';
}
function openPanel(){ $('#addPanel').classList.remove('hidden'); }
function closePanel(){ $('#addPanel').classList.add('hidden'); resetForm(); }

window.startEdit = function(id){
  const x = all.find(a=>a.id===id);
  if(!x) return;
  openPanel();
  editingId = id;
  $('#editHint').classList.remove('hidden');
  $('#editId').textContent = x.control||id;

  $('#f_control').value = x.control||'';
  $('#f_site').value    = x.site||'';
  $('#f_dept').value    = x.department||'';
  $('#f_loc').value     = x.location||'';
  $('#f_desc').value    = x.description||'';
  $('#f_tech').value    = x.tech||'';
  $('#f_pm').value      = x.pm_date||'';
};

$('#btnToggleAdd').addEventListener('click', ()=>{ 
  if($('#addPanel').classList.contains('hidden')) openPanel(); else closePanel();
});
$('#btnCancel').addEventListener('click', closePanel);

$('#btnSave').addEventListener('click', async ()=>{
  const control = $('#f_control').value.trim();
  const site    = $('#f_site').value.trim();
  const dept    = $('#f_dept').value.trim();
  const loc     = $('#f_loc').value.trim();
  const desc    = $('#f_desc').value.trim();
  const tech    = $('#f_tech').value.trim();
  const pm      = $('#f_pm').value;

  if(!control || !pm){ notify('أدخل Control و PM Date','error'); return; }
  const next = addMonths(pm,6);

  const payload = { control, site, department:dept, location:loc, description:desc, tech,
                    pm_date: pm, next_date: next, updatedAt: serverTimestamp() };

  try{
    const id = editingId || safeId(control);
    await setDoc(doc(db,'assets', id), payload, {merge:true});
    notify('تم الحفظ ✅');
    closePanel();
    await loadData();
  }catch(e){
    console.error(e);
    notify('فشل الحفظ: '+e.message,'error');
  }
});

// تحديث PM الآن
window.pmDone = async function(id){
  if(!confirm('تأكيد: تعيين PM Date لليوم واحتساب Next بعد 6 أشهر؟')) return;
  const today = toISO(new Date());
  try{
    await updateDoc(doc(db,'assets',id), { pm_date: today, next_date: addMonths(today,6), updatedAt: serverTimestamp() });
    notify('تم التحديث ✅');
    await loadData();
  }catch(e){
    console.error(e); notify('فشل التحديث: '+e.message,'error');
  }
};

// ===== Delete selected =====
$('#chkAll').addEventListener('click', e=>{
  document.querySelectorAll('.rchk').forEach(c=> c.checked = e.target.checked);
});
$('#btnDelete').addEventListener('click', async ()=>{
  const ids = Array.from(document.querySelectorAll('.rchk:checked')).map(c=>c.value);
  if(!ids.length){ notify('اختر جهازًا واحدًا على الأقل','error'); return; }
  if(!confirm('هل أنت متأكد من مسح الأجهزة المحددة؟')) return;
  notify('جارِ المسح…','info');
  for(const id of ids){
    try{ await deleteDoc(doc(db,'assets',id)); }catch(e){ console.error(e); }
  }
  notify('تم المسح ✅');
  await loadData();
});

// ===== Filters =====
$('#filterSite').addEventListener('change', applyFilters);
$('#filterDept').addEventListener('change', applyFilters);
$('#filterSearch').addEventListener('input', applyFilters);
$('#btnClearFilters').addEventListener('click', ()=>{
  $('#filterSite').value=''; $('#filterDept').value=''; $('#filterSearch').value='';
  applyFilters();
});

// Init
notify('تم الاتصال بـ Firebase ✅','ok');
loadData().catch(e=> notify('فشل التحميل: '+e.message,'error'));
</script>
</body>
</html>
