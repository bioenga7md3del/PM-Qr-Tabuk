<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>PM-QR Dashboard</title>
<style>
  :root{ --bg:#0b1220; --card:#111827; --muted:#94a3b8; --text:#111827; --ok:#10b981; --err:#ef4444; --info:#3b82f6; }
  body{background:#0b1220;color:#e5e7eb;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;margin:0}
  .notice{position:sticky;top:0;z-index:1000;padding:10px 14px;text-align:center;font-weight:700}
  .n-ok{background:rgba(16,185,129,.15);border-bottom:1px solid rgba(16,185,129,.5);color:#a7f3d0}
  .n-err{background:rgba(239,68,68,.15);border-bottom:1px solid rgba(239,68,68,.5);color:#fecaca}
  .n-info{background:rgba(59,130,246,.15);border-bottom:1px solid rgba(59,130,246,.5);color:#bfdbfe}
  .container{max-width:1300px;margin:0 auto;padding:20px}
  .card{background:#111827;border:1px solid #1f2937;border-radius:12px;padding:16px;margin:10px 0;box-shadow:0 12px 36px rgba(0,0,0,.3)}
  .row{margin:8px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  input, select{padding:10px 12px;border-radius:10px;border:1px solid #374151;background:#0b1220;color:#fff;min-width:180px}
  .btn{padding:8px 12px;border-radius:8px;border:0;cursor:pointer;font-weight:700;font-size:13px}
  .btn.ok{background:#10b981;color:#083344} .btn.secondary{background:#3b82f6;color:#e0f2fe}
  .btn.danger{background:#ef4444;color:#fff} .btn.warning{background:#f59e0b;color:#fff}
  table{width:100%;border-collapse:collapse;margin-top:10px}
  th,td{padding:8px 6px;text-align:center;border-bottom:1px solid #374151}
  thead{background:#1f2937;color:#f3f4f6}
  tbody tr{background:#f9fafb;color:#111827} /* النص أسود */
  tbody tr.row-active{background:#d1fae5;color:#111827} /* أخضر فاتح */
  tbody tr.row-over{background:#fee2e2;color:#111827}   /* أحمر فاتح */
  .tools{display:flex;gap:8px;flex-wrap:wrap}
</style>
</head>
<body>
<div id="notice" class="notice n-info">جارِ الاتصال بـ Firebase…</div>
<div class="container">
  <div class="card">
    <h1>إدارة الأجهزة</h1>
    <div class="row">
      <button class="btn ok" onclick="showAddForm()">➕ إضافة جهاز جديد</button>
      <button class="btn danger" onclick="deleteSelected()">🗑 حذف جماعي</button>
    </div>
    <div id="addForm" style="display:none;margin-top:10px">
      <input id="control" placeholder="Control Number"/>
      <input id="site" placeholder="الموقع"/>
      <input id="dept" placeholder="القسم"/>
      <input id="loc" placeholder="المكان التفصيلي"/>
      <input id="tech" placeholder="الفني"/>
      <input id="pm_date" type="date" placeholder="تاريخ الصيانة"/>
      <button class="btn ok" onclick="addAsset()">حفظ</button>
      <button class="btn secondary" onclick="hideAddForm()">إلغاء</button>
    </div>
  </div>

  <div class="card">
    <h2>قائمة الأجهزة</h2>
    <table id="assetsTable">
      <thead>
        <tr>
          <th><input type="checkbox" id="checkAll" onclick="toggleAll(this)"/></th>
          <th>Control</th><th>Site</th><th>Department</th><th>Location</th>
          <th>PM Date</th><th>Next Date</th><th>Tech</th><th>الحالة</th><th>أدوات</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
import { getFirestore, collection, getDocs, setDoc, doc, deleteDoc, serverTimestamp, orderBy, query } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDegk1oK0xV8TgrZcwbkRLA2VgzkGK_1MM",
  authDomain: "pmqrtabuk.firebaseapp.com",
  projectId: "pmqrtabuk",
  storageBucket: "pmqrtabuk.firebasestorage.app",
  messagingSenderId: "305570616285",
  appId: "1:305570616285:web:4f6839fd08b8b5aa131c34"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const $ = s=>document.querySelector(s);
const tbody = $('#tbody');
let all=[];

function notify(msg,type='info'){ const n=$('#notice');n.textContent=msg;n.className='notice '+(type==='ok'?'n-ok':type==='error'?'n-err':'n-info'); }

function calcNext(pm){ if(!pm) return ""; const d=new Date(pm); d.setMonth(d.getMonth()+6); return d.toISOString().slice(0,10); }
function statusRow(d){
  if(!d.next_date) return '—';
  const today=new Date(); const next=new Date(d.next_date);
  if(today>new Date(next.setMonth(next.getMonth()+1))) return 'منتهي';
  return 'ساري';
}

function renderTable(){
  tbody.innerHTML='';
  all.forEach(d=>{
    const st=statusRow(d);
    const tr=document.createElement('tr');
    if(st==='منتهي') tr.classList.add('row-over');
    else if(st==='ساري') tr.classList.add('row-active');
    tr.innerHTML=`
      <td><input type="checkbox" data-id="${d.id}"></td>
      <td>${d.control||''}</td>
      <td>${d.site||''}</td>
      <td>${d.department||''}</td>
      <td>${d.location||''}</td>
      <td>${d.pm_date||''}</td>
      <td>${d.next_date||''}</td>
      <td>${d.tech||''}</td>
      <td>${st}</td>
      <td class="tools">
        <button class="btn secondary" onclick="window.open('sticker.html#view/${encodeURIComponent(d.control)}','_blank')">📄 استيكر</button>
        <button class="btn warning" onclick="window.open('qr.html#view/${encodeURIComponent(d.control)}','_blank')">QR</button>
        <button class="btn danger" onclick="deleteOne('${d.id}')">🗑 مسح</button>
      </td>
    `;
    tbody.appendChild(tr);
  });
}

window.addAsset=async function(){
  const control=$('#control').value.trim();
  const site=$('#site').value.trim();
  const dept=$('#dept').value.trim();
  const loc=$('#loc').value.trim();
  const tech=$('#tech').value.trim();
  const pm=$('#pm_date').value;
  if(!control||!pm){notify('أدخل الكنترول والتاريخ','error');return;}
  const docId=control.replace(/[\/#?\s]/g,'-');
  const next=calcNext(pm);
  await setDoc(doc(db,'assets',docId),{control,site,department:dept,location:loc,tech,pm_date:pm,next_date:next,updatedAt:serverTimestamp()});
  notify('تمت إضافة الجهاز ✅','ok'); loadData(); hideAddForm();
};

window.deleteOne=async function(id){
  if(confirm('هل تريد حذف هذا الجهاز؟')){ await deleteDoc(doc(db,'assets',id)); notify('تم الحذف ✅','ok'); loadData(); }
};

window.deleteSelected=async function(){
  const checks=[...tbody.querySelectorAll('input[type=checkbox]:checked')];
  if(!checks.length){alert('اختر أجهزة للحذف');return;}
  if(confirm('هل تريد حذف الأجهزة المحددة؟')){
    for(const c of checks){ await deleteDoc(doc(db,'assets',c.dataset.id)); }
    notify('تم الحذف الجماعي ✅','ok'); loadData();
  }
};

window.toggleAll=function(master){
  tbody.querySelectorAll('input[type=checkbox]').forEach(cb=>cb.checked=master.checked);
};

window.showAddForm=function(){ $('#addForm').style.display='block'; };
window.hideAddForm=function(){ $('#addForm').style.display='none'; };

async function loadData(){
  try{
    notify('جار التحميل…');
    const qs=await getDocs(query(collection(db,'assets'), orderBy('control')));
    all=qs.docs.map(d=>({id:d.id,...d.data()}));
    renderTable(); notify('تم التحميل ✅','ok');
  }catch(e){ notify('خطأ: '+e.message,'error'); }
}
loadData();
</script>
</body>
</html>
