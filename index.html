<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>PM-QR Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .status-pill{ padding:.25rem .5rem; border-radius:999px; font-size:.75rem; font-weight:800 }
    .pill-ok{ background:#dcfce7; color:#166534 }
    .pill-warn{ background:#fef9c3; color:#854d0e }
    .pill-bad{ background:#fee2e2; color:#991b1b }
    @media print { .no-print{ display:none !important } }

    /* تلوين الصفوف حسب الحالة (ساري حتى Next+1M / منتهي بعد ذلك) */
    .row-active { background:#ecfdf5 }
    .row-over   { background:#fee2e2 }
    .row-hover:hover { filter:brightness(.98) }

    /* نص الجدول داكن وواضح */
    #tbody tr, #tbody tr.row-active, #tbody tr.row-over { color:#0f172a; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <!-- Notice -->
  <div id="notice" class="no-print text-center py-2 font-bold bg-sky-900/40 border-b border-sky-700">
    جارِ التحقق من الجلسة…
  </div>

  <!-- Topbar -->
  <header class="no-print sticky top-0 z-40 bg-slate-900/80 backdrop-blur border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="text-xl font-extrabold">لوحة PM-QR</div>
        <span id="userEmail" class="hidden md:inline text-slate-300 text-sm"></span>
        <span id="userRole" class="hidden md:inline text-slate-400 text-xs"></span>
      </div>
      <div class="flex items-center gap-2">
        <a href="import.html" class="px-3 py-2 rounded-lg bg-emerald-500 text-emerald-950 font-bold hover:opacity-90" id="linkImport">📂 رفع ملف إكسل</a>
        <button id="openAddBtn" class="px-3 py-2 rounded-lg bg-sky-500 text-sky-950 font-bold hover:opacity-90">➕ إضافة جهاز</button>
        <button id="signOutBtn" class="px-3 py-2 rounded-lg bg-slate-800 border border-slate-700 hover:bg-slate-700">تسجيل الخروج</button>
        <button id="btnAdmin" class="px-3 py-2 rounded-lg bg-purple-500 text-purple-950 font-bold hover:opacity-90" style="display:none"> 👑 إدارة المستخدمين</button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-6">
    <!-- KPIs -->
    <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4">
        <div class="text-slate-400">إجمالي الأجهزة</div>
        <div id="kpi_total" class="text-3xl font-extrabold">—</div>
      </div>
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4">
        <div class="text-slate-400">المستحقة هذا الشهر</div>
        <div id="kpi_due" class="text-3xl font-extrabold">—</div>
      </div>
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4">
        <div class="text-slate-400">متأخرة</div>
        <div id="kpi_over" class="text-3xl font-extrabold">—</div>
      </div>
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4">
        <div class="text-slate-400">خلال 30 يومًا</div>
        <div id="kpi_30" class="text-3xl font-extrabold">—</div>
      </div>
    </section>

    <!-- Filters -->
    <section class="bg-slate-900 border border-slate-800 rounded-2xl p-4 mb-3 no-print">
      <div class="grid grid-cols-1 md:grid-cols-5 gap-3">
        <input id="q" class="px-3 py-2 rounded bg-slate-950 border border-slate-800" placeholder="بحث بالـ Control أو الفني…"/>
        <select id="filter_site" class="px-3 py-2 rounded bg-slate-950 border border-slate-800">
          <option value="">كل المواقع</option>
        </select>
        <select id="filter_dept" class="px-3 py-2 rounded bg-slate-950 border border-slate-800">
          <option value="">كل الأقسام</option>
        </select>
        <select id="filter_status" class="px-3 py-2 rounded bg-slate-950 border border-slate-800">
          <option value="">كل الحالات</option>
          <option value="ok">محدّث</option>
          <option value="due">مستحق هذا الشهر</option>
          <option value="over">متأخر</option>
          <option value="soon">خلال 30 يومًا</option>
        </select>
        <div class="flex gap-2">
          <button id="refreshBtn" class="px-3 py-2 bg-slate-700 rounded">تحديث</button>
          <button id="clearFilters" class="px-3 py-2 bg-slate-800 border border-slate-700 rounded">مسح</button>
        </div>
      </div>
    </section>

    <!-- Legend + bulk -->
    <div class="no-print flex flex-wrap items-center justify-between gap-2 mb-3">
      <div class="flex items-center gap-4 text-slate-300 text-sm">
        <span class="inline-flex items-center gap-2"><i class="inline-block w-4 h-4 rounded-sm" style="background:#ecfdf5"></i> ساري (حتى Next + شهر)</span>
        <span class="inline-flex items-center gap-2"><i class="inline-block w-4 h-4 rounded-sm" style="background:#fee2e2"></i> منتهي (بعد Next + شهر)</span>
      </div>
      <div class="flex items-center gap-2">
        <button id="btnDeptQR" class="px-3 py-2 rounded bg-yellow-500 text-yellow-950 font-bold">
          🔳 طباعة QR للقسم الحالي
        </button>
        <button id="btnBulkDelete" class="px-3 py-2 rounded bg-red-600 text-white font-bold">
          🗑️ مسح الأجهزة المحددة
        </button>
      </div>
    </div>

    <!-- Table -->
    <section class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden">
      <div class="overflow-x-auto">
        <table class="min-w-full text-sm">
          <thead class="bg-slate-800 text-slate-200">
            <tr>
              <th class="p-3 text-center w-10"><input id="chkAll" type="checkbox" class="w-4 h-4"></th>
              <th class="p-3 text-right">Control</th>
              <th class="p-3 text-right">Site</th>
              <th class="p-3 text-right">Department</th>
              <th class="p-3 text-right">Location</th>
              <th class="p-3 text-right">PM Date</th>
              <th class="p-3 text-right">Next PM</th>
              <th class="p-3 text-right">Tech</th>
              <th class="p-3 text-right">الحالة</th>
              <th class="p-3 text-right">أدوات</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <div class="no-print flex items-center justify-between p-3 border-t border-slate-800">
        <div id="pageInfo" class="text-slate-400 text-sm">—</div>
        <div class="flex gap-2">
          <button id="prev" class="px-3 py-1.5 rounded bg-slate-800 border border-slate-700">السابق</button>
          <button id="next" class="px-3 py-1.5 rounded bg-slate-800 border border-slate-700">التالي</button>
        </div>
      </div>
    </section>
  </main>

  <!-- Add Modal -->
  <div id="addModal" class="fixed inset-0 bg-black/60 hidden items-center justify-center no-print">
    <div class="bg-white text-black rounded-lg shadow-xl w-full max-w-2xl p-6">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-lg font-bold">إضافة جهاز جديد</h2>
        <button id="closeAdd" class="px-3 py-1 rounded bg-gray-200">✕</button>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-3">
        <input id="a_control" placeholder="Control Number" class="w-full px-3 py-2 border rounded"/>
        <input id="a_site" placeholder="الموقع (المستشفى)" class="w-full px-3 py-2 border rounded" list="sitesList"/>
        <input id="a_dept" placeholder="القسم" class="w-full px-3 py-2 border rounded" list="deptsList"/>
        <input id="a_loc" placeholder="الوصف التفصيلي (Location)" class="w-full px-3 py-2 border rounded"/>
        <input id="a_tech" placeholder="الفني القائم بالصيانة" class="w-full px-3 py-2 border rounded"/>
        <input id="a_pm" type="date" class="w-full px-3 py-2 border rounded"/>
      </div>
      <div class="flex justify-end gap-2">
        <button id="saveAdd" class="px-4 py-2 rounded bg-sky-600 text-white font-bold">حفظ</button>
      </div>
    </div>
  </div>

  <!-- Edit Modal -->
  <div id="editModal" class="fixed inset-0 bg-black/60 hidden items-center justify-center no-print">
    <div class="bg-white text-black rounded-lg shadow-xl w-full max-w-2xl p-6">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-lg font-bold">تعديل جهاز</h2>
        <button id="closeEdit" class="px-3 py-1 rounded bg-gray-200">✕</button>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-3">
        <input id="m_control" placeholder="Control Number" class="w-full px-3 py-2 border rounded"/>
        <input id="m_site" placeholder="الموقع (المستشفى)" class="w-full px-3 py-2 border rounded" list="sitesList"/>
        <input id="m_dept" placeholder="القسم" class="w-full px-3 py-2 border rounded" list="deptsList"/>
        <input id="m_loc" placeholder="الوصف التفصيلي (Location)" class="w-full px-3 py-2 border rounded"/>
        <input id="m_tech" placeholder="الفني القائم بالصيانة" class="w-full px-3 py-2 border rounded"/>
        <input id="m_pm" type="date" class="w-full px-3 py-2 border rounded"/>
      </div>
      <div class="flex justify-end gap-2">
        <button id="saveEdit" class="px-4 py-2 rounded bg-sky-600 text-white font-bold">حفظ</button>
      </div>
    </div>
  </div>

  <!-- datalist -->
  <datalist id="sitesList"></datalist>
  <datalist id="deptsList"></datalist>

  <!-- Firebase + App -->
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js';
    import { getAuth, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js';
    import {
      getFirestore, collection, getDocs, query, orderBy, setDoc, doc, serverTimestamp, updateDoc, deleteDoc, getDoc
    } from 'https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: "AIzaSyDegk1oK0xV8TgrZcwbkRLA2VgzkGK_1MM",
      authDomain: "pmqrtabuk.firebaseapp.com",
      projectId: "pmqrtabuk",
      storageBucket: "pmqrtabuk.firebasestorage.app",
      messagingSenderId: "305570616285",
      appId: "1:305570616285:web:4f6839fd08b8b5aa131c34"
    };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // ===== Utils =====
    const $ = s => document.querySelector(s);
    const notice=(m,t='info')=>{
      const n=$('#notice');
      n.textContent=m;
      n.className='no-print text-center py-2 font-bold '+
        (t==='ok'?'bg-emerald-900/40 border-b border-emerald-700':
         t==='error'?'bg-red-900/40 border-b border-red-700':
                      'bg-sky-900/40 border-b border-sky-700');
    };
    const toISO=d=>new Date(d).toISOString().slice(0,10);
    const addMonths=(d,m)=>{const x=new Date(d); x.setMonth(x.getMonth()+m); return x};
    const safeId=s=>String(s||'').trim().replace(/[\/?#\s]+/g,'-');

    // منطق التلوين: ساري حتى (Next + شهر)، منتهي بعد ذلك
    function rowState(pm, next){
      if(!pm || !next) return 'none';
      const today    = new Date();
      const pmDate   = new Date(pm   + 'T00:00:00');
      const nextDate = new Date(next + 'T00:00:00');
      const grace    = new Date(nextDate); grace.setMonth(grace.getMonth()+1);
      if(today > grace) return 'over';
      if(today >= pmDate && today <= grace) return 'active';
      return 'none';
    }
    // عمود الحالة
    function statusOf(nextISO){
      if(!nextISO) return {key:'over',label:'—',cls:'pill-bad'};
      const today    = new Date();
      const nextDate = new Date(nextISO + 'T00:00:00');
      const grace    = new Date(nextDate); grace.setMonth(grace.getMonth()+1);
      if(today > grace) return {key:'over',label:'متأخر',cls:'pill-bad'};
      const diffDays = (nextDate - today)/86400000;
      const sameMonth = (today.getFullYear()===nextDate.getFullYear() && today.getMonth()===nextDate.getMonth());
      if(sameMonth)    return {key:'due', label:'مستحق هذا الشهر', cls:'pill-warn'};
      if(diffDays<=30) return {key:'soon',label:'خلال 30 يومًا',  cls:'pill-warn'};
      return {key:'ok',  label:'OK', cls:'pill-ok'};
    }

    // ===== Roles =====
    let currentRole = localStorage.getItem('pmqr_role') || null;
    function applyRoleUI(role){
  currentRole = role;
  document.getElementById('userRole').textContent = role ? `(${role})` : '(viewer)';

  const btnOpenAdd = document.getElementById('openAddBtn');
  const btnBulkDel = document.getElementById('btnBulkDelete');
  const linkImport = document.getElementById('linkImport');
  const btnAdmin   = document.getElementById('btnAdmin');

  const canCreate = role==='admin' || role==='engineer';
  const canBulk   = role==='admin';
  const canImport = role==='admin' || role==='engineer';
  const isAdmin   = role==='admin';

  if(btnOpenAdd) btnOpenAdd.style.display = canCreate ? '' : 'none';
  if(btnBulkDel) btnBulkDel.style.display = canBulk   ? '' : 'none';
  if(linkImport) linkImport.style.display = canImport ? '' : 'none';
  if(btnAdmin)   btnAdmin.style.display   = isAdmin   ? '' : 'none';
}
    const canWriteFull = ()=> currentRole==='admin' || currentRole==='engineer';
    const canTechOnly  = ()=> currentRole==='tech';

    // ===== Auth Guard =====
    onAuthStateChanged(auth, async user=>{
      if(!user){ location.href='login.html'; return; }
      $('#userEmail').textContent = user.email || '';
      notice('تم تسجيل الدخول ✅','ok');

      // تأكيد الدور من Firestore (يغطي حالة التبديل أثناء الجلسة)
      try{
        const snap = await getDoc(doc(db,'users', user.uid));
        const role = snap.exists() ? (snap.data().role || 'viewer') : (currentRole||'viewer');
        localStorage.setItem('pmqr_role', role);
        applyRoleUI(role);
      }catch{
        applyRoleUI(currentRole||'viewer');
      }

      loadData();
    });
    $('#signOutBtn').onclick = ()=> signOut(auth).then(()=>{ localStorage.removeItem('pmqr_role'); location.href='login.html'; });

    // ===== State =====
    let all=[], filtered=[]; let page=1; const pageSize=20; let editingId=null;

    function fillFilterOptions(){
      const sites = Array.from(new Set(all.map(x=>x.site).filter(Boolean))).sort();
      const depts = Array.from(new Set(all.map(x=>x.department).filter(Boolean))).sort();
      $('#filter_site').innerHTML = '<option value="">كل المواقع</option>' + sites.map(s=>`<option>${s}</option>`).join('');
      $('#filter_dept').innerHTML = '<option value="">كل الأقسام</option>' + depts.map(s=>`<option>${s}</option>`).join('');
      $('#sitesList').innerHTML = sites.map(s=>`<option value="${s}"></option>`).join('');
      $('#deptsList').innerHTML = depts.map(s=>`<option value="${s}"></option>`).join('');
    }

    function applyFilters(){
      const q = $('#q').value.trim().toLowerCase();
      const fs = $('#filter_site').value;
      const fd = $('#filter_dept').value;
      const fstatus = $('#filter_status').value;

      filtered = all.filter(x=>{
        const matchQ = !q || (String(x.control||'').toLowerCase().includes(q) || String(x.tech||'').toLowerCase().includes(q));
        const matchS = !fs || x.site===fs;
        const matchD = !fd || x.department===fd;
        const st = statusOf(x.next_date||'').key;
        const matchT = !fstatus || st===fstatus;
        return matchQ && matchS && matchD && matchT;
      });
      page=1; renderTable(); renderKPI();
    }

    function renderKPI(){
      $('#kpi_total').textContent = all.length;
      let due=0, over=0, soon=0;
      const today = new Date();
      for(const x of all){
        const st = statusOf(x.next_date||'').key;
        if(st==='over') over++;
        if(st==='soon') soon++;
        if(x.next_date){
          const d = new Date(x.next_date+'T00:00:00');
          if(d.getFullYear()===today.getFullYear() && d.getMonth()===today.getMonth()) due++;
        }
      }
      $('#kpi_due').textContent = due;
      $('#kpi_over').textContent = over;
      $('#kpi_30').textContent  = soon;
    }

    function renderTable(){
      const tbody = $('#tbody'); tbody.innerHTML='';
      const start = (page-1)*pageSize;
      const items = filtered.slice(start, start+pageSize);

      for(const d of items){
        const st = statusOf(d.next_date||'');
        const state = rowState(d.pm_date||'', d.next_date||'');

        const tr = document.createElement('tr');
        tr.className = 'border-b border-slate-800 row-hover';
        if(state==='active') tr.classList.add('row-active');
        if(state==='over')   tr.classList.add('row-over');

        tr.innerHTML = `
          <td class="p-3 text-center w-10">
            <input type="checkbox" class="rowChk w-4 h-4" value="${d.id}">
          </td>
          <td class="p-3 font-bold">${d.control||'—'}</td>
          <td class="p-3">${d.site||'—'}</td>
          <td class="p-3">${d.department||'—'}</td>
          <td class="p-3">${d.location||'—'}</td>
          <td class="p-3">${d.pm_date||'—'}</td>
          <td class="p-3">${d.next_date||'—'}</td>
          <td class="p-3">${d.tech||'—'}</td>
          <td class="p-3"><span class="status-pill ${st.cls}">${st.label}</span></td>
          <td class="p-3"><div class="flex flex-wrap gap-2"></div></td>
        `;

        const tools = tr.querySelector('div');
        const controlSafe = encodeURIComponent(d.control||'');

        // ✏️ تعديل (admin/engineer)
        if (canWriteFull()) {
          const btnEdit = document.createElement('button');
          btnEdit.className = 'px-2 py-1 rounded bg-sky-500 text-sky-950 font-bold';
          btnEdit.textContent = '✏️ تعديل';
          btnEdit.dataset.edit = d.id || (d.control? d.control.replace(/[\/?#\s]+/g,'-') : '');
          btnEdit.dataset.control = encodeURIComponent(d.control||'');
          btnEdit.dataset.site    = encodeURIComponent(d.site||'');
          btnEdit.dataset.dept    = encodeURIComponent(d.department||'');
          btnEdit.dataset.loc     = encodeURIComponent(d.location||'');
          btnEdit.dataset.tech    = encodeURIComponent(d.tech||'');
          btnEdit.dataset.pm      = encodeURIComponent(d.pm_date||'');
          tools.appendChild(btnEdit);
        }

        // ✅ تم عمل الصيانة (admin/engineer/tech)
        if (canWriteFull() || canTechOnly()) {
          const btnQuick = document.createElement('button');
          btnQuick.className = 'px-2 py-1 rounded bg-emerald-500 text-emerald-950 font-bold';
          btnQuick.textContent = '✅ تم عمل الصيانة';
          btnQuick.dataset.quickpm = d.id || (d.control? d.control.replace(/[\/?#\s]+/g,'-') : '');
          tools.appendChild(btnQuick);
        }

        // 🏷️ استيكر (دائمًا)
        const aSticker = document.createElement('a');
        aSticker.className = 'px-2 py-1 rounded bg-indigo-500 text-indigo-50 font-bold';
        aSticker.textContent = '🏷️ استيكر';
        aSticker.target = '_blank';
        aSticker.href = `sticker.html#view/${controlSafe}`;
        tools.appendChild(aSticker);

        // 🔳 QR (دائمًا)
        const aQR = document.createElement('a');
        aQR.className = 'px-2 py-1 rounded bg-yellow-500 text-yellow-950 font-bold';
        aQR.textContent = '🔳 QR';
        aQR.target = '_blank';
        aQR.href = `qr.html?control=${controlSafe}`;
        tools.appendChild(aQR);

        // 🖨️ طباعة الاستيكر (دائمًا)
        const aPrint = document.createElement('a');
        aPrint.className = 'px-2 py-1 rounded bg-pink-500 text-pink-50 font-bold';
        aPrint.textContent = '🖨️ طباعة';
        aPrint.target = '_blank';
        aPrint.href = `sticker.html?autoprint=1#view/${controlSafe}`;
        tools.appendChild(aPrint);

        // 🗑️ مسح فردي (admin فقط)
        if (currentRole === 'admin') {
          const btnDelete = document.createElement('button');
          btnDelete.className = 'px-2 py-1 rounded bg-red-600 text-white font-bold';
          btnDelete.textContent = '🗑️ مسح';
          btnDelete.dataset.del = d.id || (d.control? d.control.replace(/[\/?#\s]+/g,'-') : '');
          tools.appendChild(btnDelete);
        }

        document.getElementById('tbody').appendChild(tr);
      }

      const end = Math.min(start + items.length, filtered.length);
      document.getElementById('pageInfo').textContent = filtered.length ? `${start+1}–${end} من ${filtered.length}` : 'لا توجد بيانات';
      document.getElementById('chkAll').checked = false;
    }

    // Pagination
    document.getElementById('prev').onclick = ()=>{ if(page>1){ page--; renderTable(); } };
    document.getElementById('next').onclick = ()=>{ if(page*pageSize < filtered.length){ page++; renderTable(); } };

    // Filters events
    ['q','filter_site','filter_dept','filter_status'].forEach(id=>{
      const el=document.getElementById(id);
      el.addEventListener('input', applyFilters);
      el.addEventListener('change', applyFilters);
    });
    document.getElementById('refreshBtn').onclick = loadData;
    document.getElementById('clearFilters').onclick = ()=>{ ['q','filter_site','filter_dept','filter_status'].forEach(id=> document.getElementById(id).value=''); applyFilters(); };

    // زر طباعة QR للقسم الحالي
    document.getElementById('btnDeptQR')?.addEventListener('click', ()=>{
      const site = document.getElementById('filter_site').value;
      const dept = document.getElementById('filter_dept').value;
      const qs = new URLSearchParams();
      if(site) qs.set('site', site);
      if(dept) qs.set('dept', dept);
      const url = qs.toString() ? `qr.html?${qs.toString()}` : 'qr.html';
      window.open(url, '_blank');
    });

    // ===== Add Modal =====
    const addModal = document.getElementById('addModal');
    const openAdd  = ()=>{ addModal.classList.remove('hidden'); addModal.classList.add('flex'); };
    const closeAdd = ()=>{ addModal.classList.add('hidden'); addModal.classList.remove('flex'); };
    document.getElementById('openAddBtn').onclick = ()=> canWriteFull()? openAdd(): notice('صلاحياتك لا تسمح بالإضافة','error');
    document.getElementById('closeAdd').onclick   = closeAdd;

    document.getElementById('saveAdd').onclick = async ()=>{
      if(!canWriteFull()){ notice('صلاحياتك لا تسمح بالإضافة','error'); return; }
      const control = document.getElementById('a_control').value.trim();
      if(!control){ notice('أدخل Control Number','error'); return; }
      const data = {
        control,
        site: document.getElementById('a_site').value.trim(),
        department: document.getElementById('a_dept').value.trim(),
        location: document.getElementById('a_loc').value.trim(),
        tech: document.getElementById('a_tech').value.trim(),
        pm_date: document.getElementById('a_pm').value || '',
      };
      data.next_date = data.pm_date ? toISO(addMonths(new Date(data.pm_date),6)) : '';
      try{
        await setDoc(doc(db,'assets', safeId(control)), {...data, updatedAt: serverTimestamp()});
        notice('تم الحفظ ✅','ok'); closeAdd(); await loadData();
      }catch(e){ notice('فشل الحفظ: '+e.message,'error'); }
    };

    // ===== Edit / Quick PM / Delete (delegation) =====
    const editModal = document.getElementById('editModal');
    const openEdit  = ()=>{ editModal.classList.remove('hidden'); editModal.classList.add('flex'); };
    const closeEdit = ()=>{ editModal.classList.add('hidden'); editModal.classList.remove('flex'); };
    document.getElementById('closeEdit').onclick = closeEdit;

    document.addEventListener('click', async (e)=>{
      // فتح التعديل
      const be = e.target.closest('button[data-edit]');
      if(be){
        if(!canWriteFull()){ notice('صلاحياتك لا تسمح بالتعديل','error'); return; }
        const id = be.dataset.edit;
        document.getElementById('m_control').value = decodeURIComponent(be.dataset.control||'');
        document.getElementById('m_site').value    = decodeURIComponent(be.dataset.site||'');
        document.getElementById('m_dept').value    = decodeURIComponent(be.dataset.dept||'');
        document.getElementById('m_loc').value     = decodeURIComponent(be.dataset.loc||'');
        document.getElementById('m_tech').value    = decodeURIComponent(be.dataset.tech||'');
        document.getElementById('m_pm').value      = decodeURIComponent(be.dataset.pm||'');
        window._editingId = id;
        openEdit();
        return;
      }

      // تم عمل الصيانة الآن
      const bq = e.target.closest('button[data-quickpm]');
      if(bq){
        if(!(canWriteFull() || canTechOnly())){ notice('صلاحياتك لا تسمح بالتحديث','error'); return; }
        try{
          const id = bq.dataset.quickpm;
          const today = toISO(new Date());
          const next  = toISO(addMonths(new Date(today),6));
          await updateDoc(doc(db,'assets', id), { pm_date: today, next_date: next, updatedAt: serverTimestamp() });
          notice('تم تسجيل الصيانة اليوم ✅','ok');
          await loadData();
        }catch(err){ notice('فشل التحديث: ' + err.message, 'error'); }
        return;
      }

      // حذف فردي
      const bd = e.target.closest('button[data-del]');
      if(bd){
        if(currentRole!=='admin'){ notice('الحذف متاح للمشرف فقط','error'); return; }
        if(!confirm('هل تريد مسح هذا الجهاز نهائيًا؟')) return;
        try{
          await deleteDoc(doc(db,'assets', bd.dataset.del));
          notice('تم المسح 🗑️','ok');
          await loadData();
        }catch(err){ notice('فشل المسح: '+err.message,'error'); }
        return;
      }
    });

    document.getElementById('saveEdit').onclick = async ()=>{
      if(!canWriteFull()){ notice('صلاحياتك لا تسمح بالتعديل','error'); return; }
      const control = document.getElementById('m_control').value.trim();
      if(!control){ notice('أدخل Control Number','error'); return; }
      const data = {
        control,
        site: document.getElementById('m_site').value.trim(),
        department: document.getElementById('m_dept').value.trim(),
        location: document.getElementById('m_loc').value.trim(),
        tech: document.getElementById('m_tech').value.trim(),
        pm_date: document.getElementById('m_pm').value || '',
      };
      data.next_date = data.pm_date ? toISO(addMonths(new Date(data.pm_date),6)) : '';
      const id = window._editingId || safeId(control);
      try{
        await setDoc(doc(db,'assets', id), {...data, updatedAt: serverTimestamp()});
        notice('تم الحفظ ✅','ok');
        closeEdit();
        await loadData();
      }catch(e){ notice('فشل الحفظ: '+e.message,'error'); }
    };

    // ===== Select all / Bulk delete =====
    const tbodyEl = document.getElementById('tbody');
    document.getElementById('chkAll').addEventListener('change', (e)=>{
      const checked = e.target.checked;
      tbodyEl.querySelectorAll('.rowChk').forEach(c=> c.checked = checked);
    });

    document.getElementById('btnBulkDelete').addEventListener('click', async ()=>{
      if(currentRole!=='admin'){ notice('الحذف الجماعي للمشرف فقط','error'); return; }
      const ids = Array.from(tbodyEl.querySelectorAll('.rowChk:checked')).map(c=> c.value);
      if(!ids.length){ notice('اختر صفًا واحدًا على الأقل للحذف','error'); return; }
      if(!confirm(`تأكيد حذف ${ids.length} جهاز؟`)) return;
      notice('جارِ الحذف الجماعي…','info');
      let ok=0, fail=0;
      for(const id of ids){
        try{ await deleteDoc(doc(db,'assets', id)); ok++; }
        catch{ fail++; }
      }
      notice(`تم الحذف: ${ok} | فشل: ${fail}`,(fail? 'error':'ok'));
      await loadData();
    });

    // ===== Load data =====
    async function loadData(){
      try{
        notice('جارِ تحميل البيانات…');
        const qs = await getDocs(query(collection(db,'assets'), orderBy('control')));
        all = qs.docs.map(d=> ({ id: d.id, ...d.data() }));
        fillFilterOptions();
        filtered = all.slice();
        renderTable();
        renderKPI();
        notice('تم التحميل ✅','ok');
      }catch(e){ notice('فشل التحميل: '+e.message,'error'); }
    }
document.getElementById('btnAdmin')?.addEventListener('click', ()=>{
  window.location.href = 'admin.html';
});
    // أخطاء عامة
    window.addEventListener('error', e=> notice('خطأ: '+(e.error?.message||e.message),'error'));
    window.addEventListener('unhandledrejection', e=> notice('خطأ: '+(e.reason?.message||e.reason),'error'));
  </script>
</body>
</html>
