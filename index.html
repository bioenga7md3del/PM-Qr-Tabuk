<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>PM-QR Web (Tabuk Health)</title>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<style>
  :root{ --bg:#0b1220; --card:#111827; --muted:#94a3b8; --text:#e5e7eb; --ok:#10b981; --err:#ef4444; --info:#3b82f6; }
  body{background:#0b1220;color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;margin:0}
  .notice{position:sticky;top:0;z-index:1000;padding:10px 14px;text-align:center;font-weight:700}
  .n-ok{background:rgba(16,185,129,.15);border-bottom:1px solid rgba(16,185,129,.5);color:#a7f3d0}
  .n-err{background:rgba(239,68,68,.15);border-bottom:1px solid rgba(239,68,68,.5);color:#fecaca}
  .n-info{background:rgba(59,130,246,.15);border-bottom:1px solid rgba(59,130,246,.5);color:#bfdbfe}
  .container{max-width:1100px;margin:0 auto;padding:20px}
  .card{background:#111827;border:1px solid #1f2937;border-radius:12px;padding:16px;margin:10px 0;box-shadow:0 12px 36px rgba(0,0,0,.3)}
  .row{margin:8px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  input{padding:10px 12px;border-radius:10px;border:1px solid #374151;background:#0b1220;color:#fff;min-width:260px}
  .btn{padding:10px 14px;border-radius:10px;border:0;cursor:pointer;font-weight:700}
  .btn.ok{background:#10b981;color:#083344} .btn.secondary{background:#3b82f6;color:#e0f2fe}
  .qr{width:200px;height:200px;background:#fff;display:flex;align-items:center;justify-content:center;border-radius:10px}
  a.link{color:#67e8f9;text-decoration:none;word-break:break-all}
  .tools{display:flex;gap:8px;margin:8px 0}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  .user{color:#a7f3d0;font-size:.95rem}
  @media print{ .card, .notice{display:none !important} }
</style>
</head>
<body>
<div id="notice" class="notice n-info">جارِ التحقق من الجلسة…</div>

<div class="container" style="display:none" id="appRoot">
  <div class="topbar">
  <h1 style="margin:0">لوحة PM-QR</h1>
  <div>
    <a href="import.html" class="btn ok" style="margin-left:10px">📂 رفع ملف إكسل</a>
    <span class="user" id="userInfo"></span>
    <button class="btn secondary" id="signOutBtn">تسجيل الخروج</button>
  </div>
</div>

  </div>

  <div class="card">
    <h2>إضافة جهاز جديد</h2>
    <div class="row">
      <input id="control" placeholder="Control Number (مثال: AS-0001)"/>
      <input id="site" placeholder="الموقع (مستشفى)"/>
      <input id="dept" placeholder="القسم"/>
      <input id="loc" placeholder="الوصف التفصيلي (اختياري)"/>
      <input id="tech" placeholder="القائم بالصيانة"/>
      <input id="pm_date" type="date" placeholder="تاريخ الصيانة الوقائية"/>
    </div>
    <div class="row">
      <button class="btn ok" id="saveBtn">حفظ</button>
      <button class="btn secondary" id="clearBtn">مسح</button>
    </div>
    <div class="row" style="align-items:flex-start">
      <div class="qr"><img id="qrImg" alt="QR"/></div>
      <div>
        <a id="qrLink" class="link" target="_blank"></a>
        <div class="tools">
          <button class="btn secondary" id="printAddQRBtn">طباعة الكيو آر</button>
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>عرض جهاز</h2>
    <div class="row">
      <input id="viewId" placeholder="Control Number"/>
      <button class="btn secondary" id="viewBtn">عرض</button>
    </div>
    <div id="viewData"></div>
    <div class="tools">
      <button class="btn secondary" id="printViewQRBtn">طباعة الكيو آر</button>
      <a class="btn ok" id="openSticker" target="_blank" rel="noopener">فتح صفحة الاستيكر</a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
<script>
// إشعارات عامة + التقاط أخطاء
function notify(msg, type='info'){
  const n = document.getElementById('notice');
  n.textContent = msg;
  n.className = 'notice ' + (type==='ok' ? 'n-ok' : type==='error' ? 'n-err' : 'n-info');
}
window.addEventListener('error', e => notify('خطأ جافاسكربت: ' + (e.error?.message || e.message), 'error'));
window.addEventListener('unhandledrejection', e => notify('خطأ أثناء التحميل: ' + (e.reason?.message || e.reason), 'error'));

function toISO(d){ return new Date(d).toISOString().slice(0,10); }
function addMonths(dateObj, n){ const d = new Date(dateObj); d.setMonth(d.getMonth()+n); return d; }
function calcNext(pmDate){ if(!pmDate) return ""; return toISO(addMonths(new Date(pmDate),6)); }
function safeId(control){ return (control||'').trim().replace(/[\/#?\s]/g,'-'); }
// اربط QR بصفحة الاستيكر على مسار موقعك
function buildLink(control){
  return 'https://bioenga7md3del.github.io/PM-Qr-Tabuk/sticker.html#view/' + encodeURIComponent(control);
}
function makeQR(el, text){
  try { QRCode.toDataURL(text, {width:200, margin:1}).then(url=>{ el.src=url; }).catch(()=>{ el.src='https://chart.googleapis.com/chart?cht=qr&chs=200x200&chl='+encodeURIComponent(text); }); }
  catch { el.src='https://chart.googleapis.com/chart?cht=qr&chs=200x200&chl='+encodeURIComponent(text); }
}
// طباعة QR فقط
function printQR(imgId, controlText){
  const img = document.getElementById(imgId);
  if(!img || !img.src){ alert('من فضلك ولّد الكيو آر أولاً'); return; }
  const w = window.open('', '_blank');
  const title = controlText ? `QR — ${controlText}` : 'QR';
  w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>${title}</title>
    <style>body{margin:0;display:flex;align-items:center;justify-content:center;height:100vh}
    .box{display:flex;flex-direction:column;align-items:center;font-family:system-ui}
    img{width:50mm;height:50mm;} .txt{margin-top:8px;font-weight:700}</style></head><body>
    <div class="box"><img src="${img.src}"/><div class="txt">${controlText||''}</div></div>
  </body></html>`);
  w.document.close(); w.focus(); w.print(); setTimeout(()=>w.close(), 300);
}
// فورم
function clearForm(){
  ['control','site','dept','loc','tech','pm_date'].forEach(id=>{ const el=document.getElementById(id); if(el) el.value=''; });
  document.getElementById('qrImg').src=''; document.getElementById('qrLink').textContent=''; document.getElementById('qrLink').href='';
}
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js";

/* Firebase Config */
const firebaseConfig = {
  apiKey: "AIzaSyDegk1oK0xV8TgrZcwbkRLA2VgzkGK_1MM",
  authDomain: "pmqrtabuk.firebaseapp.com",
  projectId: "pmqrtabuk",
  storageBucket: "pmqrtabuk.firebasestorage.app",
  messagingSenderId: "305570616285",
  appId: "1:305570616285:web:4f6839fd08b8b5aa131c34"
};
const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);

let db; // هنهيئه بعد التأكد من المستخدم

onAuthStateChanged(auth, async (user)=>{
  if(!user){
    notify('لم يتم تسجيل الدخول — تحويل إلى صفحة الدخول…', 'n-info');
    location.href = 'login.html';
    return;
  }
  // مستخدم موجود → فعّل الصفحة
  document.getElementById('userInfo').textContent = user.email || '(مستخدم)';
  document.getElementById('appRoot').style.display = 'block';
  notify('تم تسجيل الدخول ✅ وجارِ الاتصال بـ Firebase…', 'ok');

  try{
    db = (await import('https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js')).getFirestore(app);
    notify('تم الاتصال بـ Firebase ✅', 'ok');
  }catch(e){
    notify('فشل تهيئة Firestore: ' + e.message, 'error');
    return;
  }

  // أزرار عامة
  document.getElementById('signOutBtn').onclick = ()=> signOut(auth).then(()=> location.href='login.html');

  // إضافة جهاز
  document.getElementById('saveBtn').onclick = async ()=>{
    const control = document.getElementById('control').value.trim();
    const site = document.getElementById('site').value.trim();
    const dept = document.getElementById('dept').value.trim();
    const loc  = document.getElementById('loc').value.trim();
    const tech = document.getElementById('tech').value.trim();
    const pm   = document.getElementById('pm_date').value;
    if(!control || !pm){ notify('من فضلك أدخل الكنترول وتاريخ الصيانة الوقائية', 'error'); return; }

    const docId = (await import('https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js')).doc(db,'assets', (control||'').replace(/[\/#?\s]/g,'-'));
    const link  = 'https://bioenga7md3del.github.io/PM-Qr-Tabuk/sticker.html#view/' + encodeURIComponent(control);
    makeQR(document.getElementById('qrImg'), link);
    document.getElementById('qrLink').textContent = link;
    document.getElementById('qrLink').href = link;

    try{
      const next = (function(pm){ if(!pm) return ""; const d=new Date(pm); d.setMonth(d.getMonth()+6); return d.toISOString().slice(0,10); })(pm);
      const { setDoc, serverTimestamp } = await import('https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js');
      await setDoc(docId, { control, site, department:dept, location:loc, tech, pm_date: pm, next_date: next, updatedAt: serverTimestamp() });
      notify('تم الحفظ وتوليد QR بنجاح ✅', 'ok');
    }catch(e){ notify('فشل الحفظ: ' + e.message, 'error'); }
  };

  // مسح
  document.getElementById('clearBtn').onclick = ()=> clearForm();
  // طباعة QR من قسم الإضافة
  document.getElementById('printAddQRBtn').onclick = ()=> printQR('qrImg', document.getElementById('control').value);

  // عرض جهاز
  document.getElementById('viewBtn').onclick = async ()=>{
    const idInput = document.getElementById('viewId').value.trim();
    if(!idInput){ notify('اكتب الكنترول نمبر للعرض', 'error'); return; }
    try{
      const { doc, getDoc, collection, query, where, getDocs } = await import('https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js');
      const primaryId = (idInput||'').replace(/[\/#?\s]/g,'-');
      let snap = await getDoc(doc(db,'assets', primaryId));
      if(!snap.exists()){
        const qs = await getDocs(query(collection(db,'assets'), where('control','==', idInput)));
        snap = qs.docs[0];
      }
      if(!snap || !snap.exists()){ notify('الجهاز غير موجود', 'error'); document.getElementById('viewData').innerHTML=''; return; }
      const d = snap.data();
      const link = 'https://bioenga7md3del.github.io/PM-Qr-Tabuk/sticker.html#view/' + encodeURIComponent(d.control || idInput);
      document.getElementById('viewData').innerHTML = `
        <div>
          <div>Control: <b>${d.control||idInput}</b></div>
          <div>Site: ${d.site||'—'}</div>
          <div>Department: ${d.department||'—'}</div>
          <div>Location: ${d.location||'—'}</div>
          <div>PM Date: ${d.pm_date||'—'}</div>
          <div>Next Date: ${d.next_date||'—'}</div>
          <div>Tech: ${d.tech||'—'}</div>
          <div style="margin-top:8px"><a href="${link}" class="link" target="_blank">${link}</a></div>
        </div>
        <div class="qr"><img id="v_qr" alt="QR"></div>
      `;
      makeQR(document.getElementById('v_qr'), link);
      document.getElementById('openSticker').href = link;
      notify('تم تحميل بيانات الجهاز ✅', 'ok');
    }catch(e){ notify('فشل العرض: ' + e.message, 'error'); }
  };

  // طباعة QR من قسم العرض
  document.getElementById('printViewQRBtn').onclick = ()=> printQR('v_qr', document.getElementById('viewId').value);
});
</script>
</body>
</html>
