<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>PM-QR Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { colors: { brand:'#0ea5e9'} } } };</script>
  <style>
    .status-pill{ padding:.25rem .5rem; border-radius:999px; font-size:.75rem; font-weight:800 }
    .pill-ok{ background:#dcfce7; color:#166534 }
    .pill-warn{ background:#fef9c3; color:#854d0e }
    .pill-bad{ background:#fee2e2; color:#991b1b }
    .pill-info{ background:#e2e8f0; color:#334155 }
    @media print { .no-print{ display:none !important } }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div id="notice" class="no-print text-center py-2 font-bold bg-sky-900/40 border-b border-sky-700">جارِ التحقق من الجلسة…</div>

  <!-- Topbar -->
  <header class="no-print sticky top-0 z-40 bg-slate-900/80 backdrop-blur border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="text-xl font-extrabold">لوحة PM-QR</div>
        <span id="userEmail" class="hidden md:inline text-slate-300 text-sm"></span>
      </div>
      <div class="flex items-center gap-2">
        <a href="import.html" class="px-3 py-2 rounded-lg bg-emerald-500 text-emerald-950 font-bold hover:opacity-90">📂 رفع ملف إكسل</a>
        <button id="addBtn" class="px-3 py-2 rounded-lg bg-sky-500 text-sky-950 font-bold hover:opacity-90">➕ إضافة جهاز</button>
        <button id="signOutBtn" class="px-3 py-2 rounded-lg bg-slate-800 border border-slate-700 hover:bg-slate-700">تسجيل الخروج</button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-6">
    <!-- KPI Cards -->
    <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4"><div class="text-slate-400">إجمالي الأجهزة</div><div id="kpi_total" class="text-3xl font-extrabold">—</div></div>
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4"><div class="text-slate-400">المستحقة هذا الشهر</div><div id="kpi_due" class="text-3xl font-extrabold">—</div></div>
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4"><div class="text-slate-400">متأخرة</div><div id="kpi_over" class="text-3xl font-extrabold">—</div></div>
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4"><div class="text-slate-400">خلال 30 يومًا</div><div id="kpi_30" class="text-3xl font-extrabold">—</div></div>
    </section>

    <!-- Filters -->
    <section class="no-print mt-6 bg-slate-900 border border-slate-800 rounded-2xl p-4">
      <div class="grid grid-cols-1 md:grid-cols-5 gap-3">
        <input id="q" class="px-3 py-2 rounded-lg bg-slate-950 border border-slate-800" placeholder="بحث بالـ Control أو الفني…"/>
        <select id="f_site" class="px-3 py-2 rounded-lg bg-slate-950 border border-slate-800"><option value="">كل المواقع</option></select>
        <select id="f_dept" class="px-3 py-2 rounded-lg bg-slate-950 border border-slate-800"><option value="">كل الأقسام</option></select>
        <select id="f_status" class="px-3 py-2 rounded-lg bg-slate-950 border border-slate-800">
          <option value="">كل الحالات</option>
          <option value="ok">محدّث</option>
          <option value="due">مستحق هذا الشهر</option>
          <option value="over">متأخر</option>
          <option value="soon">خلال 30 يومًا</option>
        </select>
        <div class="flex gap-2">
          <button id="refreshBtn" class="flex-1 px-3 py-2 rounded-lg bg-slate-800 border border-slate-700">تحديث</button>
          <button id="clearFilters" class="px-3 py-2 rounded-lg bg-slate-800 border border-slate-700">مسح</button>
        </div>
      </div>
    </section>

    <!-- Table -->
    <section class="mt-4 bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden">
      <div class="overflow-x-auto">
        <table class="min-w-full text-sm">
          <thead class="bg-slate-800 text-slate-200">
            <tr>
              <th class="p-3 text-right">Control</th>
              <th class="p-3 text-right">Site</th>
              <th class="p-3 text-right">Department</th>
              <th class="p-3 text-right">PM Date</th>
              <th class="p-3 text-right">Next PM</th>
              <th class="p-3 text-right">Tech</th>
              <th class="p-3 text-right">الحالة</th>
              <th class="p-3 text-right">أدوات</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <div class="flex items-center justify-between p-3 border-t border-slate-800 no-print">
        <div id="pageInfo" class="text-slate-400 text-sm">—</div>
        <div class="flex gap-2"><button id="prev" class="px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700">السابق</button><button id="next" class="px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700">التالي</button></div>
      </div>
    </section>
  </main>

  <!-- Add/Edit Modal (تقدر تعيد استخدامه) -->
  <div id="modal" class="fixed inset-0 bg-black/60 hidden items-center justify-center no-print">
    <div class="bg-white text-black rounded-lg shadow-xl w-full max-w-md p-6">
      <h2 class="text-lg font-bold mb-4" id="modalTitle">إضافة / تعديل جهاز</h2>
      <div class="space-y-3">
        <input id="m_control" placeholder="Control Number" class="w-full px-3 py-2 border rounded"/>
        <input id="m_site" placeholder="الموقع" class="w-full px-3 py-2 border rounded"/>
        <input id="m_dept" placeholder="القسم" class="w-full px-3 py-2 border rounded"/>
        <input id="m_tech" placeholder="الفني" class="w-full px-3 py-2 border rounded"/>
        <input id="m_pm" type="date" class="w-full px-3 py-2 border rounded"/>
      </div>
      <div class="flex justify-end gap-2 mt-4">
        <button onclick="closeModal()" class="px-3 py-2 bg-gray-300 rounded">إلغاء</button>
        <button id="saveBtn" class="px-3 py-2 bg-sky-500 text-white rounded">حفظ</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js';
    import { getAuth, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js';
    import { getFirestore, collection, getDocs, query, orderBy, setDoc, doc, serverTimestamp, updateDoc } from 'https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: "AIzaSyDegk1oK0xV8TgrZcwbkRLA2VgzkGK_1MM",
      authDomain: "pmqrtabuk.firebaseapp.com",
      projectId: "pmqrtabuk",
      storageBucket: "pmqrtabuk.firebasestorage.app",
      messagingSenderId: "305570616285",
      appId: "1:305570616285:web:4f6839fd08b8b5aa131c34"
    };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const $ = s => document.querySelector(s);
    const notify = (msg,type='info')=>{
      const n=$('#notice');
      n.textContent=msg;
      n.className='no-print text-center py-2 font-bold '+(type==='ok'?'bg-emerald-600':type==='error'?'bg-red-600':'bg-sky-900/40');
    };

    function addMonths(dateObj, n){ const d=new Date(dateObj); d.setMonth(d.getMonth()+n); return d; }
    function toISO(d){ return new Date(d).toISOString().slice(0,10); }

    onAuthStateChanged(auth, user=>{
      if(!user){ location.href='login.html'; return; }
      $('#userEmail').textContent=user.email||'';
      notify('مرحبًا '+user.email,'ok');
      loadAssets();
    });

    $('#signOutBtn').onclick=()=>signOut(auth);

    // زرار إضافة جهاز
    $('#addBtn').onclick=()=>{ openModal(); };

    function openModal(asset=null){
      $('#modal').classList.remove('hidden');
      if(asset){
        $('#modalTitle').textContent='تعديل جهاز';
        $('#m_control').value=asset.control;
        $('#m_site').value=asset.site;
        $('#m_dept').value=asset.department;
        $('#m_tech').value=asset.tech;
        $('#m_pm').value=asset.pm_date;
      } else {
        $('#modalTitle').textContent='إضافة جهاز';
        ['m_control','m_site','m_dept','m_tech','m_pm'].forEach(id=>$('#'+id).value='');
      }
    }
    window.closeModal=()=>$('#modal').classList.add('hidden');

    $('#saveBtn').onclick=async()=>{
      const control=$('#m_control').value.trim();
      if(!control){notify('ادخل Control','error');return;}
      const docId=control.replace(/[\/#?\s]/g,'-');
      const site=$('#m_site').value.trim();
      const dept=$('#m_dept').value.trim();
      const tech=$('#m_tech').value.trim();
      const pm=$('#m_pm').value;
      const next=pm?toISO(addMonths(new Date(pm),6)):'';
      try{
        await setDoc(doc(db,'assets',docId),{control,site,department:dept,tech,pm_date:pm,next_date:next,updatedAt:serverTimestamp()});
        notify('تم الحفظ ✅','ok');
        closeModal(); loadAssets();
      }catch(e){notify('خطأ: '+e.message,'error');}
    };

    async function loadAssets(){
      const qs=await getDocs(query(collection(db,'assets'), orderBy('control')));
      const tbody=$('#tbody'); tbody.innerHTML='';
      qs.forEach(docSnap=>{
        const d=docSnap.data();
        const tr=document.createElement('tr');
        tr.innerHTML=`
          <td class="p-2">${d.control||''}</td>
          <td class="p-2">${d.site||''}</td>
          <td class="p-2">${d.department||''}</td>
          <td class="p-2">${d.pm_date||''}</td>
          <td class="p-2">${d.next_date||''}</td>
          <td class="p-2">${d.tech||''}</td>
          <td class="p-2"><span class="status-pill pill-ok">OK</span></td>
          <td class="p-2 flex gap-2">
            <button class="px-2 py-1 bg-sky-500 text-white rounded" onclick="openModal(${JSON.stringify(d)})">✏️ تعديل</button>
            <button class="px-2 py-1 bg-emerald-500 text-white rounded" onclick="markPM('${docSnap.id}')">تم عمل الصيانة</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    window.markPM=async(id)=>{
      try{
        const today=toISO(new Date());
        const next=toISO(addMonths(new Date(),6));
        await updateDoc(doc(db,'assets',id),{pm_date:today,next_date:next,updatedAt:serverTimestamp()});
        notify('تم تحديث الصيانة ✅','ok');
        loadAssets();
      }catch(e){notify('فشل التحديث: '+e.message,'error');}
    };
  </script>
</body>
</html>
