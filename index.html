<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>PM-QR Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { colors: { brand:'#0ea5e9'} } } };</script>
  <style>
    .status-pill{ padding:.25rem .5rem; border-radius:999px; font-size:.75rem; font-weight:800 }
    .pill-ok{ background:#dcfce7; color:#166534 }
    .pill-warn{ background:#fef9c3; color:#854d0e }
    .pill-bad{ background:#fee2e2; color:#991b1b }
    .pill-info{ background:#e2e8f0; color:#334155 }
    @media print { .no-print{ display:none !important } }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <!-- Notice bar -->
  <div id="notice" class="no-print text-center py-2 font-bold bg-sky-900/40 border-b border-sky-700">جارِ التحقق من الجلسة…</div>

  <!-- Topbar -->
  <header class="no-print sticky top-0 z-40 bg-slate-900/80 backdrop-blur border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="text-xl font-extrabold">لوحة PM-QR</div>
        <span id="userEmail" class="hidden md:inline text-slate-300 text-sm"></span>
      </div>
      <div class="flex items-center gap-2">
        <a href="import.html" class="px-3 py-2 rounded-lg bg-emerald-500 text-emerald-950 font-bold hover:opacity-90">📂 رفع ملف إكسل</a>
        <button id="addBtn" class="px-3 py-2 rounded-lg bg-sky-500 text-sky-950 font-bold hover:opacity-90">➕ إضافة جهاز</button>
        <button id="signOutBtn" class="px-3 py-2 rounded-lg bg-slate-800 border border-slate-700 hover:bg-slate-700">تسجيل الخروج</button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-6">
    <!-- KPI Cards -->
    <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4">
        <div class="text-slate-400">إجمالي الأجهزة</div>
        <div id="kpi_total" class="text-3xl font-extrabold">—</div>
      </div>
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4">
        <div class="text-slate-400">المستحقة هذا الشهر</div>
        <div id="kpi_due" class="text-3xl font-extrabold">—</div>
      </div>
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4">
        <div class="text-slate-400">متأخرة</div>
        <div id="kpi_over" class="text-3xl font-extrabold">—</div>
      </div>
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4">
        <div class="text-slate-400">خلال 30 يومًا</div>
        <div id="kpi_30" class="text-3xl font-extrabold">—</div>
      </div>
    </section>

    <!-- Filters -->
    <section class="no-print mt-6 bg-slate-900 border border-slate-800 rounded-2xl p-4">
      <div class="grid grid-cols-1 md:grid-cols-5 gap-3">
        <input id="q" class="px-3 py-2 rounded-lg bg-slate-950 border border-slate-800" placeholder="بحث بالـ Control أو الفني…"/>
        <select id="f_site" class="px-3 py-2 rounded-lg bg-slate-950 border border-slate-800"><option value="">كل المواقع</option></select>
        <select id="f_dept" class="px-3 py-2 rounded-lg bg-slate-950 border border-slate-800"><option value="">كل الأقسام</option></select>
        <select id="f_status" class="px-3 py-2 rounded-lg bg-slate-950 border border-slate-800">
          <option value="">كل الحالات</option>
          <option value="ok">محدّث</option>
          <option value="due">مستحق هذا الشهر</option>
          <option value="over">متأخر</option>
          <option value="soon">خلال 30 يومًا</option>
        </select>
        <div class="flex gap-2">
          <button id="refreshBtn" class="flex-1 px-3 py-2 rounded-lg bg-slate-800 border border-slate-700">تحديث</button>
          <button id="clearFilters" class="px-3 py-2 rounded-lg bg-slate-800 border border-slate-700">مسح</button>
        </div>
      </div>
    </section>

    <!-- Table -->
    <section class="mt-4 bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden">
      <div class="overflow-x-auto">
        <table class="min-w-full text-sm">
          <thead class="bg-slate-800 text-slate-200">
            <tr>
              <th class="p-3 text-right">Control</th>
              <th class="p-3 text-right">Site</th>
              <th class="p-3 text-right">Department</th>
              <th class="p-3 text-right">PM Date</th>
              <th class="p-3 text-right">Next PM</th>
              <th class="p-3 text-right">Tech</th>
              <th class="p-3 text-right">الحالة</th>
              <th class="p-3 text-right">أدوات</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <!-- Pagination -->
      <div class="flex items-center justify-between p-3 border-t border-slate-800 no-print">
        <div id="pageInfo" class="text-slate-400 text-sm">—</div>
        <div class="flex gap-2">
          <button id="prev" class="px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700">السابق</button>
          <button id="next" class="px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700">التالي</button>
        </div>
      </div>
    </section>
  </main>

  <!-- Add/Edit Modal -->
  <div id="modal" class="fixed inset-0 bg-black/60 hidden items-center justify-center no-print">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 w-[95vw] max-w-2xl">
      <div class="flex items-center justify-between mb-4">
        <div class="text-lg font-extrabold">إضافة جهاز</div>
        <button id="closeModal" class="text-slate-300 hover:text-white">✕</button>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
        <input id="m_control" class="px-3 py-2 rounded-lg bg-slate-950 border border-slate-800" placeholder="Control Number"/>
        <input id="m_site" class="px-3 py-2 rounded-lg bg-slate-950 border border-slate-800" placeholder="Site"/>
        <input id="m_dept" class="px-3 py-2 rounded-lg bg-slate-950 border border-slate-800" placeholder="Department"/>
        <input id="m_loc" class="px-3 py-2 rounded-lg bg-slate-950 border border-slate-800" placeholder="Location (اختياري)"/>
        <input id="m_tech" class="px-3 py-2 rounded-lg bg-slate-950 border border-slate-800" placeholder="Technician"/>
        <input id="m_pm" type="date" class="px-3 py-2 rounded-lg bg-slate-950 border border-slate-800" placeholder="PM Date"/>
      </div>
      <div class="flex justify-end gap-2 mt-4">
        <button id="saveModal" class="px-4 py-2 rounded-lg bg-sky-500 text-sky-950 font-bold">حفظ</button>
        <button id="cancelModal" class="px-4 py-2 rounded-lg bg-slate-800 border border-slate-700">إلغاء</button>
      </div>
    </div>
  </div>

  <!-- QR lib -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

  <!-- Firebase -->
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js';
    import { getAuth, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js';
    import { getFirestore, collection, getDocs, query, orderBy, setDoc, doc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: 'AIzaSyDegk1oK0xV8TgrZcwbkRLA2VgzkGK_1MM',
      authDomain: 'pmqrtabuk.firebaseapp.com',
      projectId: 'pmqrtabuk',
      storageBucket: 'pmqrtabuk.firebasestorage.app',
      messagingSenderId: '305570616285',
      appId: '1:305570616285:web:4f6839fd08b8b5aa131c34'
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Utils
    const $ = s => document.querySelector(s);
    function notify(msg, type='info'){
      const n = $('#notice');
      n.textContent = msg;
      n.className = 'no-print text-center py-2 font-bold ' + (type==='ok'?'bg-emerald-900/40 border-b border-emerald-700': type==='error'?'bg-red-900/40 border-b border-red-700':'bg-sky-900/40 border-b border-sky-700');
    }
    const toISO = d => new Date(d).toISOString().slice(0,10);
    const addMonths = (d, m)=>{const x=new Date(d); x.setMonth(x.getMonth()+m); return x};
    const calcNext = pm => pm? toISO(addMonths(pm,6)) : '';
    const safeId = s => String(s||'').trim().replace(/[\\/?#\\s]+/g,'-');
    const buildLink = control => 'https://bioenga7md3del.github.io/PM-Qr-Tabuk/sticker.html#view/' + encodeURIComponent(control);

    function statusOf(nextISO){
      if(!nextISO) return {key:'info',label:'غير محدد'};
      const today = new Date();
      const next = new Date(nextISO + 'T00:00:00');
      const diff = (next - today) / (1000*60*60*24);
      if(diff < 0) return {key:'over', label:'متأخر'};
      if(diff <= 30) return {key:'soon', label:'خلال 30 يومًا'};
      const inSameMonth = today.getFullYear()===next.getFullYear() && today.getMonth()===next.getMonth();
      if(inSameMonth) return {key:'due', label:'مستحق هذا الشهر'};
      return {key:'ok', label:'محدّث'};
    }
    function pillHtml(st){
      const cls = st.key==='ok'?'pill-ok': st.key==='soon'?'pill-warn': st.key==='over'?'pill-bad':'pill-info';
      return `<span class="status-pill ${cls}">${st.label}</span>`;
    }

    // Auth guard
    onAuthStateChanged(auth, async user=>{
      if(!user){ location.href='login.html'; return; }
      $('#userEmail').textContent = user.email || '';
      notify('تم تسجيل الدخول ✅','ok');
      await loadData();
    });

    $('#signOutBtn').onclick = ()=> signOut(auth).then(()=> location.href='login.html');

    // Modal controls
    const modal = $('#modal');
    const openModal = ()=>{ modal.classList.remove('hidden'); modal.classList.add('flex'); };
    const closeModal = ()=>{ modal.classList.add('hidden'); modal.classList.remove('flex'); };
    $('#addBtn').onclick = ()=>{ ['m_control','m_site','m_dept','m_loc','m_tech','m_pm'].forEach(id=>$('#'+id).value=''); openModal(); };
    $('#closeModal').onclick = closeModal; $('#cancelModal').onclick = closeModal;

    $('#saveModal').onclick = async ()=>{
      const control = $('#m_control').value.trim();
      const site = $('#m_site').value.trim();
      const department = $('#m_dept').value.trim();
      const location = $('#m_loc').value.trim();
      const tech = $('#m_tech').value.trim();
      const pm = $('#m_pm').value;
      if(!control || !pm){ notify('أدخل الكنترول وتاريخ الصيانة', 'error'); return; }
      const next = calcNext(new Date(pm));
      try{
        await setDoc(doc(db,'assets', safeId(control)), { control, site, department, location, tech, pm_date: pm, next_date: next, updatedAt: serverTimestamp() });
        notify('تم الحفظ ✅','ok');
        closeModal();
        await loadData();
      }catch(e){ notify('فشل الحفظ: '+e.message,'error'); }
    };

    // Data + table
    let all = []; // all assets
    let filtered = [];
    let page = 1; const pageSize = 25;

    function applyFilters(){
      const q = $('#q').value.trim().toLowerCase();
      const fs = $('#f_site').value; const fd = $('#f_dept').value; const fst = $('#f_status').value;
      filtered = all.filter(x=>{
        const matchQ = !q || (String(x.control||'').toLowerCase().includes(q) || String(x.tech||'').toLowerCase().includes(q));
        const matchS = !fs || x.site===fs; const matchD = !fd || x.department===fd;
        const st = statusOf(x.next_date||'');
        const matchT = !fst || st.key===fst;
        return matchQ && matchS && matchD && matchT;
      });
      page = 1; renderTable(); renderKPI();
    }

    function renderKPI(){
      $('#kpi_total').textContent = all.length;
      const today = new Date();
      const ym = today.getFullYear()+''+today.getMonth();
      let due=0, over=0, soon=0;
      for(const x of all){
        const st = statusOf(x.next_date||'');
        if(st.key==='over') over++;
        if(st.key==='soon') soon++;
        if(x.next_date){ const d=new Date(x.next_date+'T00:00:00'); const ym2=d.getFullYear()+''+d.getMonth(); if(ym2===ym) due++; }
      }
      $('#kpi_due').textContent = due; $('#kpi_over').textContent = over; $('#kpi_30').textContent = soon;
    }

    function renderTable(){
      const tbody = $('#tbody'); tbody.innerHTML='';
      const start = (page-1)*pageSize; const items = filtered.slice(start, start+pageSize);
      for(const d of items){
        const st = statusOf(d.next_date||'');
        const tr = document.createElement('tr');
        tr.className = 'border-b border-slate-800 hover:bg-slate-900/40';
        const pm = d.pm_date||'—'; const nx = d.next_date||'—';
        tr.innerHTML = `
          <td class="p-3 font-bold">${d.control||'—'}</td>
          <td class="p-3">${d.site||'—'}</td>
          <td class="p-3">${d.department||'—'}</td>
          <td class="p-3">${pm}</td>
          <td class="p-3">${nx}</td>
          <td class="p-3">${d.tech||'—'}</td>
          <td class="p-3">${pillHtml(st)}</td>
          <td class="p-3 flex gap-2">
            <a href="${buildLink(d.control)}" target="_blank" class="px-2 py-1 rounded-lg bg-sky-600 text-sky-950 font-bold">استيكر</a>
            <button class="px-2 py-1 rounded-lg bg-slate-800 border border-slate-700" data-qr="${encodeURIComponent(buildLink(d.control))}" data-ctl="${d.control}">طباعة QR</button>
          </td>`;
        tbody.appendChild(tr);
      }
      $('#pageInfo').textContent = `${Math.min(start+1, filtered.length)}–${Math.min(start+items.length, filtered.length)} من ${filtered.length}`;
    }

    $('#prev').onclick = ()=>{ if(page>1){ page--; renderTable(); } };
    $('#next').onclick = ()=>{ if(page*pageSize < filtered.length){ page++; renderTable(); } };

    // Print QR handler
    document.addEventListener('click', e=>{
      const btn = e.target.closest('button[data-qr]');
      if(!btn) return;
      const url = decodeURIComponent(btn.dataset.qr);
      const ctl = btn.dataset.ctl || '';
      try {
        QRCode.toDataURL(url, {width:200, margin:1}).then(dataUrl=>{
          const w = window.open('', '_blank');
          const title = ctl? `QR — ${ctl}`: 'QR';
          w.document.write(`<!doctype html><html><head><meta charset='utf-8'><title>${title}</title>
            <style>body{margin:0;display:flex;align-items:center;justify-content:center;height:100vh}
            .box{display:flex;flex-direction:column;align-items:center;font-family:system-ui}
            img{width:50mm;height:50mm;} .txt{margin-top:8px;font-weight:700}</style></head><body>
            <div class='box'><img src='${dataUrl}'/><div class='txt'>${ctl}</div></div>
          </body></html>`);
          w.document.close(); w.focus(); w.print(); setTimeout(()=>w.close(), 300);
        });
      }catch{}
    });

    // Load data
    async function loadData(){
      try{
        notify('جارِ تحميل البيانات…');
        const qs = await getDocs(query(collection(db,'assets'), orderBy('control')));
        all = qs.docs.map(d => ({ id: d.id, ...d.data() }));
        // Fill filters
        const sites = Array.from(new Set(all.map(x=>x.site).filter(Boolean))).sort();
        const depts = Array.from(new Set(all.map(x=>x.department).filter(Boolean))).sort();
        $('#f_site').innerHTML = '<option value="">كل المواقع</option>' + sites.map(s=>`<option>${s}</option>`).join('');
        $('#f_dept').innerHTML = '<option value="">كل الأقسام</option>' + depts.map(s=>`<option>${s}</option>`).join('');
        filtered = all.slice(); renderTable(); renderKPI();
        notify('تم التحميل ✅','ok');
      }catch(e){ notify('فشل التحميل: '+e.message,'error'); }
    }

    // Filters handlers
    ['q','f_site','f_dept','f_status'].forEach(id=>{
      document.getElementById(id).addEventListener('input', applyFilters);
      document.getElementById(id).addEventListener('change', applyFilters);
    });
    $('#refreshBtn').onclick = loadData;
    $('#clearFilters').onclick = ()=>{ ['q','f_site','f_dept','f_status'].forEach(id=> document.getElementById(id).value=''); applyFilters(); };

    // Global error capture
    window.addEventListener('error', e=> notify('خطأ: ' + (e.error?.message||e.message),'error'));
    window.addEventListener('unhandledrejection', e=> notify('خطأ: ' + (e.reason?.message||e.reason),'error'));
  </script>
</body>
</html>
