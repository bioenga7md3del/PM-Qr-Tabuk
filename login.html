<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>PM-QR – Login</title>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body{background:#0b1220;color:#e5e7eb;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial}
  .card{background:#111827;border:1px solid #1f2937;border-radius:16px;box-shadow:0 12px 36px rgba(0,0,0,.35)}
  .notice{position:sticky;top:0;z-index:50;text-align:center;font-weight:800}
  .n-ok{background:rgba(16,185,129,.15);border-bottom:1px solid rgba(16,185,129,.5);color:#a7f3d0}
  .n-err{background:rgba(239,68,68,.15);border-bottom:1px solid rgba(239,68,68,.5);color:#fecaca}
  .n-info{background:rgba(59,130,246,.15);border-bottom:1px solid rgba(59,130,246,.5);color:#bfdbfe}
  input{background:#0b1220;border:1px solid #374151;border-radius:12px;padding:12px;color:#fff}
  label{color:#cbd5e1;font-size:.9rem}
  .tab{cursor:pointer;padding:.5rem 1rem;border-radius:999px;border:1px solid #334155}
  .tab.active{background:#3b82f6;color:#e0f2fe;border-color:#3b82f6}
</style>
</head>
<body class="min-h-screen flex items-center justify-center px-4">
  <div id="notice" class="notice n-info w-full py-2">مرحبًا! سجّل الدخول للمتابعة…</div>

  <div class="card w-full max-w-xl p-6">
    <h1 class="text-2xl font-extrabold mb-4">PM-QR – تسجيل الدخول</h1>

    <div class="flex items-center gap-2 mb-5">
      <button id="tabLogin" class="tab active">تسجيل الدخول</button>
      <button id="tabRegister" class="tab">تسجيل جديد</button>
    </div>

    <form id="formLogin" class="space-y-3">
      <div class="grid gap-2">
        <label>البريد الإلكتروني</label>
        <input id="l_email" type="email" placeholder="example@domain.com" required/>
      </div>
      <div class="grid gap-2">
        <label>كلمة المرور</label>
        <input id="l_password" type="password" placeholder="••••••••" required/>
      </div>
      <button type="submit" class="w-full py-3 bg-sky-600 rounded-xl font-bold hover:opacity-90">دخول</button>
    </form>

    <form id="formRegister" class="space-y-3 hidden">
      <div class="grid gap-2">
        <label>الاسم</label>
        <input id="r_name" type="text" placeholder="الاسم الكامل"/>
      </div>
      <div class="grid gap-2">
        <label>البريد الإلكتروني</label>
        <input id="r_email" type="email" placeholder="example@domain.com" required/>
      </div>
      <div class="grid gap-2">
        <label>كلمة المرور</label>
        <input id="r_password" type="password" placeholder="••••••••" required/>
      </div>
      <p class="text-sm text-slate-400">ملاحظة: الدور الافتراضي للمستخدم الجديد <b>viewer</b>. يمكنك ترقيته من Firestore لاحقًا.</p>
      <button type="submit" class="w-full py-3 bg-emerald-600 rounded-xl font-bold hover:opacity-90">تسجيل</button>
    </form>
  </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDegk1oK0xV8TgrZcwbkRLA2VgzkGK_1MM",
  authDomain: "pmqrtabuk.firebaseapp.com",
  projectId: "pmqrtabuk",
  storageBucket: "pmqrtabuk.firebasestorage.app",
  messagingSenderId: "305570616285",
  appId: "1:305570616285:web:4f6839fd08b8b5aa131c34"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

const $ = s=>document.querySelector(s);
const notice = (msg,t='info')=>{
  const n = $('#notice'); n.textContent = msg;
  n.className = 'notice ' + (t==='ok'?'n-ok': t==='error'?'n-err':'n-info');
};

// تبويب
const tabLogin = $('#tabLogin'), tabRegister = $('#tabRegister');
const formLogin = $('#formLogin'), formRegister = $('#formRegister');
tabLogin.onclick = ()=>{ tabLogin.classList.add('active'); tabRegister.classList.remove('active'); formLogin.classList.remove('hidden'); formRegister.classList.add('hidden'); };
tabRegister.onclick = ()=>{ tabRegister.classList.add('active'); tabLogin.classList.remove('active'); formRegister.classList.remove('hidden'); formLogin.classList.add('hidden'); };

// لو مسجّل بالفعل → روح للداشبورد
onAuthStateChanged(auth, async (user)=>{
  if(user){
    // حاول تجيب دوره وخزّنه
    try{
      const snap = await getDoc(doc(db,'users', user.uid));
      const role = snap.exists() ? (snap.data().role || 'viewer') : 'viewer';
      localStorage.setItem('pmqr_role', role);
    }catch{}
    location.href = 'index.html';
  }
});

// تسجيل الدخول
formLogin.onsubmit = async (e)=>{
  e.preventDefault();
  const email = $('#l_email').value.trim();
  const pass  = $('#l_password').value;
  try{
    notice('جارِ تسجيل الدخول…');
    const {user} = await signInWithEmailAndPassword(auth, email, pass);
    // اقرأ الدور وخزّنه
    try{
      const snap = await getDoc(doc(db,'users', user.uid));
      const role = snap.exists() ? (snap.data().role || 'viewer') : 'viewer';
      localStorage.setItem('pmqr_role', role);
    }catch{}
    notice('تم الدخول ✅','ok');
    location.href = 'index.html';
  }catch(e){
    notice('فشل تسجيل الدخول: ' + e.message, 'error');
  }
};

// تسجيل جديد
formRegister.onsubmit = async (e)=>{
  e.preventDefault();
  const name = $('#r_name').value.trim();
  const email = $('#r_email').value.trim();
  const pass  = $('#r_password').value;
  if(!email || !pass){ notice('أدخل بريد وكلمة مرور', 'error'); return; }
  try{
    notice('جارِ إنشاء الحساب…');
    const {user} = await createUserWithEmailAndPassword(auth, email, pass);
    // إنشاء مستند المستخدم (role=viewer افتراضيًا)
    await setDoc(doc(db,'users', user.uid), {
      name: name || '',
      email,
      role: 'viewer',
      sites: [],
      departments: [],
      createdAt: serverTimestamp(),
      updatedAt: serverTimestamp()
    });
    localStorage.setItem('pmqr_role', 'viewer');
    notice('تم إنشاء الحساب ✅','ok');
    location.href = 'index.html';
  }catch(e){
    notice('فشل إنشاء الحساب: ' + e.message, 'error');
  }
};

// أخطاء عامة
window.addEventListener('error', e=> notice('خطأ: '+(e.error?.message||e.message),'error'));
window.addEventListener('unhandledrejection', e=> notice('خطأ: '+(e.reason?.message||e.reason),'error'));
</script>
</body>
</html>
