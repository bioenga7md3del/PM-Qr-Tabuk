<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Login • PM-QR</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body{background:#0b1220}
    .card{background:#ffffff;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
    .leftClip{clip-path: inset(0 0 0 0 round 18px 0 0 18px)}
    .brand-img{filter: drop-shadow(0 6px 16px rgba(0,0,0,.15))}
    .notice{position:sticky;top:0;text-align:center;font-weight:800}
    .n-ok{background:#e8fff4;color:#065f46}
    .n-err{background:#ffe8e8;color:#7f1d1d}
    .n-info{background:#e8f1ff;color:#1e3a8a}
  </style>
</head>
<body class="min-h-screen flex items-center justify-center px-4 py-8">

  <!-- إشعار أعلى -->
  <div id="notice" class="notice n-info w-full max-w-5xl mx-auto mb-4 rounded-lg py-2 hidden">…</div>

  <main class="card w-full max-w-5xl grid grid-cols-1 lg:grid-cols-2 overflow-hidden">
    <!-- العمود الأيسر (صورة/لوجوهات) -->
    <aside class="leftClip hidden lg:flex flex-col items-center justify-center gap-8 bg-gradient-to-br from-sky-500 to-blue-600 p-10 text-white">
      <div class="text-center">
        <div class="text-2xl font-extrabold">إدارة أصولك بأمان</div>
        <div class="opacity-90">نظام الصيانة الوقائية PM-QR</div>
      </div>
      <div class="flex flex-col items-center gap-6">
        <!-- ضع مسارات الشعارات الموجودة في المستودع -->
        <img src="TabukCluster.jpeg" alt="Tabuk Health Cluster" class="brand-img h-20 object-contain"/>
        <img src="FGC.jpeg" alt="First Gulf Company" class="brand-img h-16 object-contain"/>
      </div>
    </aside>

    <!-- العمود الأيمن (الفورم) -->
    <section class="p-8 md:p-12">
      <div class="max-w-md mx-auto">
        <h1 class="text-2xl md:text-3xl font-extrabold text-slate-900 mb-6">Welcome to IAssets</h1>

        <label class="block text-slate-700 font-semibold mb-2" for="email">Email</label>
        <input id="email" type="email" placeholder="example@domain.com"
               class="w-full mb-4 px-4 py-3 rounded-lg border border-slate-300 bg-slate-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-sky-500"/>

        <div class="flex items-center justify-between">
          <label class="block text-slate-700 font-semibold mb-2" for="password">Password</label>
          <button id="btnReset" class="text-sky-600 hover:underline text-sm">Forgot Password ?</button>
        </div>
        <input id="password" type="password" placeholder="••••••••"
               class="w-full mb-6 px-4 py-3 rounded-lg border border-slate-300 bg-slate-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-sky-500"/>

        <button id="btnLogin"
                class="w-full py-3 rounded-lg bg-sky-500 hover:bg-sky-600 text-white font-bold transition">
          Login
        </button>

        <div class="mt-8 text-center text-slate-500 text-sm">
          © <span id="year"></span> PM-QR
        </div>
      </div>
    </section>
  </main>

  <!-- Firebase + منطق الدخول -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, sendPasswordResetEmail, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDegk1oK0xV8TgrZcwbkRLA2VgzkGK_1MM",
      authDomain: "pmqrtabuk.firebaseapp.com",
      projectId: "pmqrtabuk",
      storageBucket: "pmqrtabuk.firebasestorage.app",
      messagingSenderId: "305570616285",
      appId: "1:305570616285:web:4f6839fd08b8b5aa131c34"
    };

    const app  = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const $ = s => document.querySelector(s);
    const notice = (msg, type='info')=>{
      const n = $('#notice'); n.textContent = msg; n.className = 'notice ' + (type==='ok'?'n-ok':type==='error'?'n-err':'n-info');
      n.classList.remove('hidden');
    };

    // لو المستخدم مسجل أصلاً، دخّله مباشرة
    onAuthStateChanged(auth, (u)=>{
      if(u) { window.location.href = 'index.html'; }
    });

    document.getElementById('year').textContent = new Date().getFullYear();

    // Login
    $('#btnLogin').addEventListener('click', async ()=>{
      const email = $('#email').value.trim();
      const pass  = $('#password').value;
      if(!email || !pass){ notice('من فضلك أدخل البريد وكلمة المرور','error'); return; }
      try{
        await signInWithEmailAndPassword(auth, email, pass);
        notice('تم تسجيل الدخول ✅','ok');
        window.location.href = 'index.html';
      }catch(e){
        let msg = 'فشل تسجيل الدخول';
        if(e.code === 'auth/user-not-found') msg = 'الحساب غير موجود';
        if(e.code === 'auth/wrong-password') msg = 'كلمة المرور غير صحيحة';
        if(e.code === 'auth/too-many-requests') msg = 'محاولات كثيرة، حاول لاحقًا';
        notice(msg, 'error');
      }
    });

    // Forgot password
    $('#btnReset').addEventListener('click', async ()=>{
      const email = $('#email').value.trim();
      if(!email){ notice('اكتب البريد الإلكتروني أولاً','error'); return; }
      try{
        await sendPasswordResetEmail(auth, email);
        notice('تم إرسال رابط إعادة تعيين كلمة المرور إلى بريدك ✅','ok');
      }catch(e){
        notice('تعذر إرسال رابط الاستعادة: ' + (e.message||''), 'error');
      }
    });

    // إدخال بالـ Enter
    ['email','password'].forEach(id=>{
      document.getElementById(id).addEventListener('keydown', (ev)=>{
        if(ev.key==='Enter') $('#btnLogin').click();
      });
    });
  </script>
</body>
</html>
