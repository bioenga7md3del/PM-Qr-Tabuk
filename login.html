<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>تسجيل الدخول – PM-QR</title>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<style>
  :root{--bg:#0b1220;--card:#111827;--muted:#94a3b8;--text:#e5e7eb;--ok:#10b981;--err:#ef4444}
  html,body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;margin:0}
  .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}
  .card{background:#111827;border:1px solid #1f2937;border-radius:14px;padding:20px 18px;box-shadow:0 14px 40px rgba(0,0,0,.35);max-width:420px;width:100%}
  h1{margin:0 0 10px}
  .muted{color:var(--muted);margin-bottom:14px}
  .row{display:flex;flex-direction:column;gap:10px}
  input{padding:12px;border-radius:10px;border:1px solid #374151;background:#0b1220;color:#fff}
  .btn{padding:12px;border-radius:10px;border:0;cursor:pointer;font-weight:800}
  .btn-ok{background:var(--ok);color:#052e2b}
  .btn-sec{background:#3b82f6;color:#e0f2fe}
  .msg{margin-top:10px;font-weight:700}
  .err{color:#fecaca} .ok{color:#a7f3d0}
  .links{display:flex;gap:10px;justify-content:space-between;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>تسجيل الدخول</h1>
    <div class="muted">ادخل بريدك وكلمة المرور للدخول إلى لوحة PM-QR.</div>
    <div class="row">
      <input id="email" type="email" placeholder="البريد الإلكتروني"/>
      <input id="password" type="password" placeholder="كلمة المرور"/>
      <button class="btn btn-ok" id="loginBtn">دخول</button>
      <div class="links">
        <button class="btn btn-sec" id="resetBtn" type="button">نسيت كلمة المرور</button>
        <a href="sticker.html" class="btn btn-sec" style="text-align:center; text-decoration:none">صفحة الاستيكر</a>
      </div>
      <div id="msg" class="msg"></div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, sendPasswordResetEmail, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDegk1oK0xV8TgrZcwbkRLA2VgzkGK_1MM",
  authDomain: "pmqrtabuk.firebaseapp.com",
  projectId: "pmqrtabuk",
  storageBucket: "pmqrtabuk.firebasestorage.app",
  messagingSenderId: "305570616285",
  appId: "1:305570616285:web:4f6839fd08b8b5aa131c34"
};
const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);

// لو المستخدم مسجّل بالفعل، دخّله على طول
onAuthStateChanged(auth, (user)=>{
  if(user){ location.href = "index.html"; }
});

const $ = s => document.querySelector(s);
const msg = $('#msg');

function show(m, ok=false){
  msg.textContent = m;
  msg.className = 'msg ' + (ok ? 'ok' : 'err');
}

$('#loginBtn').onclick = async ()=>{
  const email = $('#email').value.trim();
  const pass  = $('#password').value;
  if(!email || !pass){ show("أكمل البريد وكلمة المرور"); return; }
  try{
    await signInWithEmailAndPassword(auth, email, pass);
    show("تم تسجيل الدخول ✅", true);
    setTimeout(()=> location.href = "index.html", 400);
  }catch(e){
    show("فشل الدخول: " + (e.code||e.message));
  }
};

$('#resetBtn').onclick = async ()=>{
  const email = $('#email').value.trim();
  if(!email){ show("اكتب البريد أولاً لإرسال رابط إعادة التعيين"); return; }
  try{
    await sendPasswordResetEmail(auth, email);
    show("تم إرسال رابط إعادة التعيين إلى بريدك ✅", true);
  }catch(e){
    show("تعذر إرسال الرابط: " + (e.code||e.message));
  }
};
</script>
</body>
</html>
